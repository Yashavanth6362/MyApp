name: Initialize News Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create folders
        run: |
          mkdir -p data
          mkdir -p articles
          mkdir -p images

      - name: Create breaking.json
        run: |
          test -f data/breaking.json || cat > data/breaking.json <<EOF
          {
            "title":"Breaking News"
          }
          EOF

      - name: Create latest.json
        run: |
          test -f data/latest.json || echo "[]" > data/latest.json

      - name: Create krs.json
        run: |
          test -f data/krs.json || cat > data/krs.json <<EOF
          {
            "level":"0",
            "inflow":"0",
            "outflow":"0"
          }
          EOF

      - name: Create hemavathi.json
        run: |
          test -f data/hemavathi.json || cat > data/hemavathi.json <<EOF
          {
            "level":"0",
            "inflow":"0",
            "outflow":"0"
          }
          EOF

      - name: Create pandavapura.json
        run: |
          test -f data/pandavapura.json || echo "[]" > data/pandavapura.json

      - name: Create melukote.json
        run: |
          test -f data/melukote.json || echo "[]" > data/melukote.json

      - name: Create sample article 1001
        run: |
          test -f articles/1001.json || cat > articles/1001.json <<EOF
          {
            "id":1001,
            "title":"Sample News",
            "image":"",
            "date":"",
            "content":""
          }
          EOF

      - name: Create sample article 1002
        run: |
          test -f articles/1002.json || cat > articles/1002.json <<EOF
          {
            "id":1002,
            "title":"Sample News",
            "image":"",
            "date":"",
            "content":""
          }
          EOF

      - name: Create sample article 1003
        run: |
          test -f articles/1003.json || cat > articles/1003.json <<EOF
          {
            "id":1003,
            "title":"Sample News",
            "image":"",
            "date":"",
            "content":""
          }
          EOF

      - name: Create .gitkeep for images
        run: |
          touch images/.gitkeep

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add .

          git commit -m "Initial news repository structure" || echo "Nothing to commit"

          git push